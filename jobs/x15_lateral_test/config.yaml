meta:
    job_name: "X15_Lateral_Test"
    description: "X-15 Mach 3.42 Lateral Test"

vehicle:
    model: "X15"

instructions:
    earth_model: "WGS84"
    gravity_type: "J2"
    integrator: "RK45"
    wind: false
    simulation:
        enabled: true
        t0_s: 0.0
        tf_s: 5.5
        dt_s: 0.012
    perform_trim: false
    analysis:
        comparison:
            enabled: true
            external_data: false
            path: "flight_data/X15_Rudder_Pulse_FT.npz"
            save_compare: true
            plot_values: true
            show_values: true
            plot_error: false
            show_error: false
            plots:
                6dof: true
                controls: true
                aerodynamics: true
                geodetic: true

output:
    save_data: true
    show_plots: false
    plots:
        6dof: true
        attitude: true
        controls: true
        aerodynamics: true
        air_data: true
        geodetic: true
        ned_velocity: true
        forces: true
        load_factors: true
        3d_trajectory: true

initial_conditions:
    Mach: 3.42
    alpha_deg: 2.6
    beta_deg: 0.32
    h_m: 24824.436
    p_rps: -0.05
    q_rps: 0.0
    r_rps: -0.015
    phi_deg: 0.0
    theta_deg: -13.6
    psi_deg: 0.0
    dela_ach_deg: 0.0
    dele_ach_deg: 0.0
    delr_ach_deg: 0.0
    lat_deg: 32.335556
    long_deg: -106.405833
    m_fuel_kg: 0.0

control:
    type: "time_history"
    aileron:
        enabled: true   # on if control input should act through it
        input_file: "flight_data/lateral_flight_test_aileron_time_history_Yancey64.csv"
    elevator:
        enabled: false  # on if control input should act through it
    rudder:
        enabled: true   # on if control input should act through it
        input_file: "flight_data/lateral_flight_test_rudder_time_history_Yancey64.csv"
    sas: true
    Kq: 8
    Kp: 0
    Kyar: 0
    Kr: 0
    speedbrake: true