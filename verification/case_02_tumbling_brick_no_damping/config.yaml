meta:
    job_name: "Tumbling_Brick_No_Damping"
    description: "Tumbling Brick, no damping"

vehicle:
    model: "NASAAtmos02Brick"
    overrides:

instructions:
    earth_model: "WGS84"
    gravity_type: "J2"
    integrator: "RK45"
    simulate: true
    compare: false
    t0_s: 0.0
    tf_s: 30.0
    dt_s: 0.012

output:
    save_data: true
    show_plots: false
    plots:
        6dof: true
        attitude: true
        controls: true
        aerodynamics: true
        geodetic: true
        ned_velocity: true

compare:
    path: "comparison_data/X15_Stabilizer_Pulse_FT.npz"
    save_compare: true
    show_plots: true

initial_conditions:
    h_ft: 0
    lat_deg: 0
    long_deg: 0

    u_n_fps: 0
    v_n_fps: 0
    w_n_fps: 0

    p_rps: 10
    q_rps: 20
    r_rps: 30
    phi_deg: 0
    theta_deg: 0
    psi_deg: 0