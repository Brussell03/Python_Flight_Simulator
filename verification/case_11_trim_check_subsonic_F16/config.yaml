meta:
    job_name: "Trim_Check_Subsonic_F16"
    description: "Subsonic F16 Trim Check"

vehicle:
    model: "F16"
    overrides:

instructions:
    earth_model: "WGS84"
    gravity_type: "J2"
    integrator: "RK45"
    simulate: true
    wind: false
    perform_trim: true
    compare: true
    t0_s: 0.0
    tf_s: 180.0
    dt_s: 0.012

output:
    save_data: true
    show_plots: false
    plots:
        6dof: true
        attitude: true
        controls: true
        aerodynamics: true
        geodetic: true
        ned_velocity: true

compare:
    path: "verification_data"
    save_compare: true
    plot_values: true
    show_values: true
    plot_error: true
    show_error: false
    plots:
        6dof: true
        attitude: true
        controls: true
        aerodynamics: true
        geodetic: true
        ned_velocity: true

initial_conditions:
    h_ft: 10013
    lat_deg: 36.019167
    long_deg: -75.674444

    u_n_fps: 400
    v_n_fps: 400
    w_n_fps: 0

    p_dps: 0
    q_dps: 0
    r_dps: 0
    phi_deg: -0.17183011
    theta_deg: 2.643330876
    psi_deg: 45

trim:
    trim_mode: "straight_and_level"