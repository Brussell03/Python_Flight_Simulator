meta:
    job_name: "Dropped_Sphere_Stationary_Earth"
    description: "Dropped Sphere (Stationary round earth)"

vehicle:
    model: "Cannonball"
    overrides:

instructions:
    earth_model: "Spherical_NonRotating"
    gravity_type: "inverse_square"
    integrator: "RK45"
    simulation:
        enabled: true
        t0_s: 0.0
        tf_s: 30.0
        dt_s: 0.012
    analysis:
        comparison:
            enabled: true
            path: "verification_data"
            save_compare: true
            plot_values: true
            show_values: true
            plot_error: true
            show_error: false
            plots:
                6dof: true
                attitude: true
                controls: false
                aerodynamics: true
                air_data: true
                geodetic: true
                ned_velocity: true

output:
    save_data: true
    show_plots: false
    plots:
        6dof: true
        attitude: true
        controls: false
        aerodynamics: true
        air_data: true
        geodetic: true
        ned_velocity: true

initial_conditions:
    h_ft: 30000
    lat_deg: 0
    long_deg: 0

    u_n_fps: 0
    v_n_fps: 0
    w_n_fps: 0

    p_dps: 10
    q_dps: 20
    r_dps: 30
    phi_deg: 0
    theta_deg: 0
    psi_deg: 0